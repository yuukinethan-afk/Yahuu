<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPAMSCAM Web UI</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .banner {
            color: #58a6ff;
            text-align: center;
            font-size: 14px;
            white-space: pre;
            line-height: 1.2;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #8b949e;
        }
        input {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2ea043;
        }
        button:disabled {
            background-color: #484f58;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
            color: #e3b341;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Teks Banner tiruan dari kode main.py kamu -->
        <div class="banner">
███████╗██████╗  █████╗ ███╗   ███╗███████╗ ██████╗
██╔════╝██╔══██╗██╔══██╗████╗ ████║██╔════╝██╔════╝
███████╗██████╔╝███████║██╔████╔██║███████╗██║     
╚════██║██╔═══╝ ██╔══██║██║╚██╔╝██║╚════██║██║     
███████║██║     ██║  ██║██║ ╚═╝ ██║███████║╚██████╗
╚══════╝╚═╝     ╚═╝  ╚═╝╚═╝     ╚═╝╚══════╝ ╚═════╝
        </div>

        <form id="spamForm">
            <div class="form-group">
                <label>Nomor HP Target:</label>
                <input type="text" id="noHp" placeholder="Contoh: 08978397772" required>
            </div>
            <div class="form-group">
                <label>Jumlah Resend (Siklus):</label>
                <input type="number" id="jmlResend" value="1" min="1" required>
            </div>
            <button type="submit" id="submitBtn">Mulai Serangan OTP</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('spamForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Mencegah halaman reload
            
            const noHp = document.getElementById('noHp').value;
            const jmlResend = document.getElementById('jmlResend').value;
            const btn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');

            btn.disabled = true;
            statusDiv.innerText = "Memproses, mohon tunggu...";

            try {
                // Memanggil API backend Flask kita
                const response = await fetch('/api/spam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ no_hp: noHp, resend: jmlResend })
                });

                const result = await response.json();
                
                if (response.ok) {
                    statusDiv.style.color = "#3fb950";
                    statusDiv.innerText = "Sukses! Cek console browser untuk detail.";
                    console.log("Hasil:", result);
                } else {
                    statusDiv.style.color = "#f85149";
                    statusDiv.innerText = "Error: " + result.pesan;
                }
            } catch (error) {
                statusDiv.style.color = "#f85149";
                statusDiv.innerText = "Gagal terhubung ke server.";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
